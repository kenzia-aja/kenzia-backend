name: Quick check (1 jam)

on:
  schedule:
    - cron: "0 * * * *" # tiap jam pas
  workflow_dispatch:
    inputs:
      catalog_pages:
        description: "Jumlah halaman katalog"
        default: "1"
      latest_pages:
        description: "Halaman homepage"
        default: "2"

concurrency:
  group: scrape-sync
  cancel-in-progress: false

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependensi
        run: pip install httpx beautifulsoup4

      - name: Quick scrape (homepage + halaman 1)
        run: |
          python scraper.py \
            --catalog-pages "${{ github.event.inputs.catalog_pages || '1' }}" \
            --latest-pages "${{ github.event.inputs.latest_pages || '2' }}" \
            --sources-newest 50 \
            --output data/db.json

      - name: Migrasi
        run: python migrate_db.py data/db.json

      - name: Sync ke Supabase
        run: python sync_supabase.py --db data/db.json

      - name: Commit cache
        run: |
          git config user.name "scrape-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/db.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan"
          else
            git commit -m "chore: quick scrape [skip ci]"
            git push
          fi