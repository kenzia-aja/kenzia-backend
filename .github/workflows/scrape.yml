name: Scrape catalog

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      catalog_pages:
        description: "Jumlah halaman katalog"
        default: "1"
      sources_newest:
        description: "Ambil embed untuk N episode terbaru"
        default: "2000"

permissions:
  contents: write

concurrency:
  group: scrape-sync
  cancel-in-progress: false

jobs:
  scrape-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pulihkan state dari Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python restore_from_supabase.py --output data/db.json

      - name: Scrape catalog
        run: |
          python scraper.py \
            --catalog-pages "${{ github.event.inputs.catalog_pages || '1' }}" \
            --latest-pages 1 \
            --sources-newest "${{ github.event.inputs.sources_newest || '2000' }}" \
            --concurrency 6 --output data/db.json

      - name: Migrasi db.json (perbaiki nomor, dedup, urutkan)
        run: python migrate_db.py data/db.json

      - name: Sync ke Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python sync_supabase.py --db data/db.json
